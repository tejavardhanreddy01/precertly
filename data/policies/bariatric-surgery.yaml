id: bariatric-surgery
title: Bariatric Surgery for Treatment of Co-Morbid Conditions Related to Morbid Obesity
document: NCD 100.1
verified_on: 2026-10-09
sources:
  - title: CMS Medicare Coverage Database, NCD 100.1
    url: https://www.cms.gov/medicare-coverage-database/view/ncd.aspx?ncdid=57

criteria:
  - id: bmi-35-plus
    text: Body mass index of 35 or higher.
    kind: clinical
    thresholds: { min_bmi: 35 }
    evidence: [Observation]

  - id: obesity-comorbidity
    text: At least one co-morbidity related to obesity (type 2 diabetes qualifies).
    kind: clinical
    evidence: [Condition]

  - id: failed-medical-treatment
    text: The patient has previously been unsuccessful with medical treatment for obesity.
    kind: clinical
    evidence: [Procedure, MedicationRequest, CarePlan, DocumentReference]

  - id: covered-procedure-type
    text: The requested procedure is a covered type - open or laparoscopic Roux-en-Y gastric bypass, open or laparoscopic BPD/DS, laparoscopic adjustable gastric banding, or laparoscopic sleeve gastrectomy where the MAC covers it.
    kind: coverage
    evidence: [ServiceRequest]

variants:
  - id: bariatric
    title: Bariatric surgery
    codes: ["43644", "43770", "43775", "43846"]
    logic:
      all_of:
        - bmi-35-plus
        - obesity-comorbidity
        - failed-medical-treatment
        - covered-procedure-type

not_covered:
  - Treatment for obesity alone
  - Open adjustable gastric banding
  - Open sleeve gastrectomy
  - Open or laparoscopic vertical banded gastroplasty
  - Intestinal bypass surgery
  - Gastric balloon for obesity

notes:
  - Stand-alone laparoscopic sleeve gastrectomy is covered at MAC discretion under the same criteria (since June 27, 2012).
  - Facility certification has not been required since September 24, 2013.
