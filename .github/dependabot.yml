version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  # infra/ is a separate Python project and a separate npm project.
  - package-ecosystem: uv
    directory: /infra
    schedule:
      interval: weekly
    groups:
      infra-python:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /infra
    schedule:
      interval: weekly
    groups:
      infra-npm:
        patterns: ["*"]

  # web/ is the recorded-mode site: its own npm project and lock.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-npm:
        patterns: ["*"]
    # typescript-eslint does not yet allow TypeScript 7; lift this when its peer range does.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # web/package.json pins engines.node 24.x; the type definitions stay on the runtime's major version.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
    # Python is 3.12 in requires-python and CI; a new minor or major is a deliberate change.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
