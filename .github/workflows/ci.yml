name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: precertly
          POSTGRES_PASSWORD: precertly
          POSTGRES_DB: precertly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precertly -d precertly_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      PRECERTLY_TEST_DATABASE_URL: postgresql+asyncpg://precertly:precertly@localhost:5432/precertly_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
