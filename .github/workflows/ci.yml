name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to full commit SHAs; Dependabot proposes updates weekly.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # shellcheck is preinstalled on the ubuntu-latest runner.
      - run: shellcheck scripts/*.sh

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright
      # infra/ has its own environment and lock.
      - name: Type-check the CDK app
        working-directory: infra
        run: |
          uv sync --locked
          uv run pyright

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: precertly
          POSTGRES_PASSWORD: precertly
          POSTGRES_DB: precertly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U precertly -d precertly_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      # Migrations and tests share the service database; the test fixture resets the schema.
      PRECERTLY_DATABASE_URL: postgresql+asyncpg://precertly:precertly@localhost:5432/precertly_test
      PRECERTLY_TEST_DATABASE_URL: postgresql+asyncpg://precertly:precertly@localhost:5432/precertly_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Migrations apply and match the models
        run: uv run alembic upgrade head && uv run alembic check
      - name: Eval case bundles match the build script
        run: uv run python evals/build_cases.py --check
      - run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Audit the locked dependencies
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Audit the locked dependencies of infra/
        working-directory: infra
        run: |
          uv sync --locked
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/infra-requirements.txt"
          uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/infra-requirements.txt"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Build only: nothing is pushed and no registry login is made.
      - name: Build the API image
        run: docker build --tag precertly-api:ci .
      # Runs the image detached with a short health interval, so the Dockerfile HEALTHCHECK
      # itself is what is waited on. Nothing here needs a database or AWS.
      - name: Smoke-test the image
        run: |
          docker run --detach --name precertly-api --publish 8000:8000 \
            --health-interval 5s precertly-api:ci
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' precertly-api)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health status: $status"
          [ "$status" = healthy ]
          for path in /health /policies; do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "http://localhost:8000$path")
            echo "GET $path -> $code"
            [ "$code" = 200 ]
          done
          docker exec precertly-api alembic heads | tee heads.txt
          grep -q '(head)' heads.txt
      - name: Show container logs on failure
        if: failure()
        run: docker logs precertly-api
      - name: Stop the container
        if: always()
        run: docker rm --force precertly-api

  pas-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Committed PAS drafts match the builder
        run: uv run python -m precertly.pas --check
      # The validator jar and the PAS package are pinned by sha256 in the script, which
      # checks them after every restore; the package cache holds the IG's dependencies.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/fhir-validator/bin
            ~/.fhir/packages
          key: fhir-validator-${{ hashFiles('scripts/validate_pas.py') }}
      - run: java -version
      - name: HL7 FHIR Validator on the PAS drafts (offline)
        run: uv run python scripts/validate_pas.py

  # Nothing here has credentials, and the AWS SDK is pointed at a closed local port, so any AWS
  # call from synthesis would fail the job.
  infra-synth:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      # The Node release is read from engines.node in infra/package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: infra/package.json
      - run: uv sync --locked
      - run: npm ci
      - run: uv run pytest -q
      - name: Synthesize without credentials or lookups
        env:
          AWS_ENDPOINT_URL: http://127.0.0.1:9
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          npx --no-install cdk synth --no-lookups -c budgetEmail=ci@example.invalid -c imageTag=sha-000000000000
          npx --no-install cdk ls -c budgetEmail=ci@example.invalid -c imageTag=sha-000000000000 | tee stacks.txt
          [ "$(sort stacks.txt | tr '\n' ' ')" = "precertly-app precertly-base precertly-data " ]

  # The recorded-mode site. It reads only the files the Python export writes, so the job builds
  # them first. No credentials, no AWS, no model calls.
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The Node release is read from engines.node in web/package.json.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/package.json
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install the web dependencies
        working-directory: web
        run: npm ci
      - name: Export the recorded data and generate the types
        working-directory: web
        run: npm run prepare-data
      - name: Type-check
        working-directory: web
        run: npm run check
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Audit the locked dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Check the built site for hosts outside the allowlist
        working-directory: web
        run: node scripts/check-dist.mjs
