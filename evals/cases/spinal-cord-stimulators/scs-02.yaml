id: scs-02
policy: spinal-cord-stimulator
policy_version:
  NCD 160.7: "1"
  LCD L36204: "23"
  Article A57792: "12"
variant: trial
request:
  date: 2026-10-05
  service_date: 2026-10-19
  procedure: spinal cord stimulator trial with temporary percutaneous leads
  codes: ["63650"]
  leads: 1
  contacts: 8
  place_of_service: "22"  # synthetic; the setting the criteria read
bundle: bundles/scs-02.json
expected_overall: not_met
tags: [clean]
notes: >-
  Clean trial case that fails on one fact. The psychological evaluation of 2026-09-08 documents an active cocaine use disorder (urine drug screen positive that day, last use on 2026-09-04), the team advises addiction medicine first, and the request goes ahead after the patient declines the referral. The LCD bars a trial for a patient with active substance abuse issues. The psychological evaluation itself took place, so psychological screening is met. The chart says there was no previous trial, so the repeat-trial criterion is not applicable.
changed_labels:
  - criterion: no-active-substance-abuse
    quote: >-
      Must not have active substance abuse issues
    why: >-
      The psychological evaluation records an active cocaine use disorder with a positive urine drug screen on 2026-09-08 and last use on 2026-09-04. The record documents the excluded condition, so the label is not_met (GUIDELINES rule 3).
expected:
  - criterion: late-resort-chronic-intractable-pain
    outcome: met
    fact: >-
      Low back and left leg pain for 71 months, still 8/10 after medication, physical therapy, surgery and psychological therapy. The pain clinic evaluation of 2026-05-18 and the team conference of 2026-09-15 both call spinal cord stimulation a late resort.
    evidence: [Condition/chronic-pain, DocumentReference/note-pain-clinic-eval, DocumentReference/note-team-conference]

  - criterion: other-modalities-tried-or-unsuitable
    outcome: met
    fact: >-
      Naproxen (minimal benefit), 12 weeks of physical therapy (no improvement), a left L4-5 microdiscectomy (6 weeks of relief), gabapentin, duloxetine and oxycodone with acetaminophen (pain still 8/10) and cognitive behavioral therapy (pain unchanged) were tried and did not prove satisfactory.
    evidence: [MedicationRequest/naproxen, MedicationRequest/gabapentin, MedicationRequest/duloxetine, MedicationRequest/oxycodone-apap, Procedure/physical-therapy-course, Procedure/lumbar-microdiscectomy, Procedure/cbt-course, DocumentReference/note-pt-discharge, DocumentReference/note-postop, DocumentReference/note-pain-clinic-2021, DocumentReference/note-cbt-discharge, DocumentReference/note-pain-clinic-2022, DocumentReference/note-pain-clinic-eval]

  - criterion: multidisciplinary-screening
    outcome: met
    fact: >-
      The conference of 2026-09-15 had a pain physician, a spine surgeon, a clinical psychologist and a physical therapist, who reviewed the physical evaluation of 2026-05-18 and the psychological evaluation of 2026-09-08.
    evidence: [Encounter/enc-team-conference, DocumentReference/note-team-conference, DocumentReference/note-psych-eval, DocumentReference/note-pain-clinic-eval]

  - criterion: screening-documented-in-chart
    outcome: met
    fact: >-
      The history and examination (2026-05-18), the psychological evaluation (2026-09-08) and the team conference (2026-09-15) are in the chart.
    evidence: [DocumentReference/note-pain-clinic-eval, DocumentReference/note-psych-eval, DocumentReference/note-team-conference]

  - criterion: no-active-substance-abuse
    outcome: not_met
    fact: >-
      Active cocaine use disorder: the psychological evaluation of 2026-09-08 records a positive urine drug screen that day and last use on 2026-09-04, and the visit of 2026-09-29 says the patient declined the referral to addiction medicine.
    evidence: [Condition/cocaine-use-disorder, DocumentReference/note-psych-eval, DocumentReference/note-team-conference, DocumentReference/note-trial-request]

  - criterion: patient-education-and-disclosure
    outcome: met
    fact: >-
      The education visit of 2026-09-22 records an extensive discussion of the risks and benefits of the therapy.
    evidence: [DocumentReference/note-education]

  - criterion: psychological-screening
    outcome: met
    fact: >-
      A clinical psychologist evaluated the patient on 2026-09-08.
    evidence: [Procedure/psychological-evaluation, DocumentReference/note-psych-eval]

  - criterion: trials-max-2-per-region-lifetime
    outcome: met
    fact: >-
      The evaluation of 2026-05-18 says there was no previous trial or implant, so this would be the first trial.
    evidence: [DocumentReference/note-pain-clinic-eval, DocumentReference/note-trial-request]

  - criterion: leads-max-2-or-16-contacts
    outcome: met
    fact: >-
      The request is for 1 lead and 8 contacts. That is within a maximum of 2 leads or 16 contacts.
    evidence: [request.leads, request.contacts]

  - criterion: repeat-trial-extenuating-circumstances
    outcome: not_applicable
    fact: >-
      The evaluation of 2026-05-18 states that there was no previous spinal cord stimulator trial or implant, so the condition (a previous trial failed) does not hold.
    evidence: []

  - criterion: diagnosis-and-prior-therapies-in-record
    outcome: met
    fact: >-
      The chart holds the diagnosis (chronic low back and left leg pain after lumbar surgery), the lumbar MRI of 2026-04-20 and each therapy tried with its result.
    evidence: [Condition/chronic-pain, DiagnosticReport/mri-lumbar, DocumentReference/note-pain-clinic-eval, DocumentReference/note-pt-discharge, DocumentReference/note-postop, DocumentReference/note-pain-clinic-2021, DocumentReference/note-cbt-discharge, DocumentReference/note-pain-clinic-2022]
