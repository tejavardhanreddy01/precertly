id: facet-03
policy: facet-joint-interventions
policy_version:
  LCD L38773: "32"
  Article A58364: "42"
variant: second-diagnostic
request:
  date: 2026-10-05
  service_date: 2026-10-08
  procedure: second diagnostic medial branch block
  technique: medial_branch_block
  codes: ["64493", "64494"]
  region: lumbar
  levels: [L4-5, L5-S1]
  same_day_blocks: []
  place_of_service: "11"  # office; synthetic, used only for the PAS draft
bundle: bundles/facet-03.json
expected_overall: not_met
tags: [clean, near-miss-threshold]
notes: >-
  One change from the second-diagnostic baseline: the second block is planned 10 days after the first instead of 21, and the record gives no clinical reason for the shorter interval.
changed_labels:
  - criterion: second-diagnostic-2-weeks-after-first
    quote: >-
      The second diagnostic procedure may only be performed a minimum of 2 weeks after the initial diagnostic procedure.
    why: >-
      Ten days is less than the two-week minimum, and no exception is documented.
expected:
  - criterion: chronic-axial-pain-functional-deficit
    outcome: met
    fact: >-
      Predominantly axial low back pain, moderate to severe; NRS 7/10 and ODI 48% at baseline; cannot stand longer than 15 minutes.
    evidence: [Condition/chronic-low-back-pain, DocumentReference/note-pcp, DocumentReference/note-pt-discharge, DocumentReference/note-pain-clinic-eval, Observation/pain-nrs-baseline, Observation/odi-baseline, DocumentReference/note-mbb1]

  - criterion: pain-minimum-3-months
    outcome: met
    fact: >-
      Pain began 2026-04-03, six months before the request date.
    evidence: [Condition/chronic-low-back-pain, DocumentReference/note-pcp, DiagnosticReport/mri-lumbar, DocumentReference/note-pain-clinic-eval]

  - criterion: conservative-care-failed
    outcome: met
    fact: >-
      Naproxen with minimal benefit and a 12-week course of physical therapy with no meaningful improvement in pain or function.
    evidence: [DocumentReference/note-pcp, MedicationRequest/naproxen, Procedure/physical-therapy-course, DocumentReference/note-pt-discharge, DiagnosticReport/mri-lumbar, DocumentReference/note-pain-clinic-eval]

  - criterion: no-untreated-radiculopathy
    outcome: met
    fact: >-
      Neurological exam documented: normal strength, sensation and reflexes, negative straight-leg raise, no radicular symptoms and no neurogenic claudication.
    evidence: [DocumentReference/note-pcp, DocumentReference/note-pain-clinic-eval]

  - criterion: no-non-facet-pathology
    outcome: met
    fact: >-
      Lumbar MRI shows facet arthropathy at L4-5 and L5-S1 with no fracture, tumor, infection or significant deformity.
    evidence: [DiagnosticReport/mri-lumbar, DocumentReference/note-pain-clinic-eval]

  - criterion: pain-scale-at-baseline
    outcome: met
    fact: >-
      Baseline pain 7/10 on the Numerical Rating Scale, recorded at the pain clinic evaluation before any block.
    evidence: [Observation/pain-nrs-baseline, DocumentReference/note-pain-clinic-eval]

  - criterion: pain-scale-after-each-diagnostic
    outcome: met
    fact: >-
      Pain recorded on the same NRS 0-10 after the first block (1/10).
    evidence: [Observation/pain-post-mbb1, DocumentReference/note-mbb1, DocumentReference/note-second-block-planning]

  - criterion: disability-scale-at-baseline
    outcome: met
    fact: >-
      Oswestry Disability Index 48% at the pain clinic evaluation.
    evidence: [Observation/odi-baseline, DocumentReference/note-pain-clinic-eval]

  - criterion: scales-documented
    outcome: met
    fact: >-
      The notes name both scales, the Numerical Rating Scale (NRS) 0-10 and the Oswestry Disability Index (ODI).
    evidence: [DocumentReference/note-pain-clinic-eval, Observation/pain-nrs-baseline, Observation/odi-baseline, Observation/pain-pre-mbb1, Observation/pain-post-mbb1, DocumentReference/note-mbb1, DocumentReference/note-second-block-planning]

  - criterion: no-generalized-pain-indication
    outcome: met
    fact: >-
      The record documents no fibromyalgia and no widespread or centralized pain syndrome.
    evidence: [DocumentReference/note-pain-clinic-eval]

  - criterion: not-after-alif
    outcome: met
    fact: >-
      The record documents no prior spine surgery, including no lumbar fusion.
    evidence: [DocumentReference/note-pain-clinic-eval]

  - criterion: one-spinal-region-per-session
    outcome: met
    fact: >-
      The request is for the lumbar region only.
    evidence: [request.region, request.levels]

  - criterion: levels-1-to-2
    outcome: met
    fact: >-
      The request covers two levels, L4-5 and L5-S1.
    evidence: [request.levels]

  - criterion: same-day-blocks-justified
    outcome: not_applicable
    fact: >-
      The request lists no other blocks for the same day, so the criterion's condition does not hold.
    evidence: []

  - criterion: ia-diagnostic-only-if-mbb-not-possible
    outcome: not_applicable
    fact: >-
      The requested procedure is a medial branch block, not an intraarticular block, so the criterion's condition does not hold.
    evidence: []

  - criterion: first-diagnostic-80pct-relief
    outcome: met
    fact: >-
      The first block on 2026-09-28 gave (7 - 1) / 7 = 86% relief, lasting about 6 hours, consistent with bupivacaine.
    evidence: [Procedure/mbb1, Observation/pain-pre-mbb1, Observation/pain-post-mbb1, DocumentReference/note-mbb1, DocumentReference/note-second-block-planning]

  - criterion: second-diagnostic-same-level
    outcome: met
    fact: >-
      The request is for the same levels as the first block, L4-5 and L5-S1.
    evidence: [request.levels, Procedure/mbb1, DocumentReference/note-mbb1, DocumentReference/note-second-block-planning]

  - criterion: second-diagnostic-2-weeks-after-first
    outcome: not_met
    fact: >-
      The second block is planned for 2026-10-08, 10 days after the first block on 2026-09-28, and the record documents no clinical reason for the shorter interval.
    evidence: [request.service_date, Procedure/mbb1, DocumentReference/note-mbb1, DocumentReference/note-second-block-planning]

  - criterion: diagnostic-sessions-max-4
    outcome: met
    fact: >-
      One diagnostic session in the last 12 months (2026-09-28); the requested block would be the second.
    evidence: [DocumentReference/note-pain-clinic-eval, Procedure/mbb1, DocumentReference/note-mbb1, DocumentReference/note-second-block-planning]

  - criterion: no-diagnostic-at-level-of-successful-rfa
    outcome: not_applicable
    fact: >-
      The patient has never had radiofrequency ablation, so the criterion's condition does not hold.
    evidence: []
