# Local development database: Postgres 16 with pgvector.
#   docker compose up -d db
# Published on host port 5433 so it does not clash with a Postgres already on 5432.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: precertly
      POSTGRES_PASSWORD: precertly
      POSTGRES_DB: precertly
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U precertly -d precertly"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
