[project]
name = "precertly"
version = "0.1.0"
description = "AI copilot that checks prior-authorization criteria against FHIR patient charts, with cited evidence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Teja Avuthu" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "boto3>=1.43.111",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "alembic>=1.20.0",
    "pgvector>=0.5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "botocore[crt]>=1.43.111",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/precertly"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
